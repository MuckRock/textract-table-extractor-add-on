title: Textract Table Extractor
description: Extract tables from your documents using Amazon Textract
disclosures: |
  This Add-On sends inputs to Amazon Textract which uses machine learning, a form of AI, to extract tabular data from documents. 
  We have applied an account wide opt-out of using inputs sent to Amazon Textract for further model training. 
  Read about Amazon Textract's privacy and training [policies](https://aws.amazon.com/textract/faqs/#data-privacy--823zv7) to learn more.
instructions: ''
type: object
documents:
  - selected
properties:
  output_format:
    title: Output format
    type: string
    default: csv
    enum:
      - csv
      - xlsx
  start_page:
    title: Start page 
    type: integer
    description: 'Page number where the table(s) begin'
    default: 1
  end_page:
    title: End page 
    type: integer
    description: 'Page number where the table(s) begin'
    default: 1
categories: 
  - extraction
  - premium
cost:
  price: 10
  amount: 1
  unit: page
version: 2
